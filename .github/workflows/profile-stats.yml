name: profile stats

# Renders the stats cards in README.md from the GitHub GraphQL API with the
# built-in GITHUB_TOKEN and publishes them to the profile-stats branch.
# No personal token and no third-party stats service.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile-stats.mjs
      - .github/workflows/profile-stats.yml
  pull_request:
    paths:
      - scripts/profile-stats.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

env:
  STATS_USERS: joshua-v-dev,RevealUIStudio
  STATS_ORGS: revealui-studio
  STATS_BRANCH: profile-stats

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_OUT: ${{ runner.temp }}/stats
        run: |
          node scripts/profile-stats.mjs > "$RUNNER_TEMP/stats.log"
          {
            echo '### Profile stats'
            echo '```json'
            cat "$STATS_OUT/stats.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pull requests only render, so a PR can show the numbers without
      # touching the published branch.
      - name: Publish to the stats branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_OUT: ${{ runner.temp }}/stats
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$RUNNER_TEMP/publish"
          git init -q "$work"
          cd "$work"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch -q --depth 1 "$remote" "$STATS_BRANCH"; then
            git checkout -q -b "$STATS_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$STATS_BRANCH"
          fi
          cp "$STATS_OUT"/overview.svg "$STATS_OUT"/languages.svg "$STATS_OUT"/stats.json .
          printf '%s\n' \
            '# profile-stats' \
            '' \
            'Generated by .github/workflows/profile-stats.yml on main. Do not edit by hand.' > README.md
          git add -A
          if git diff --cached --quiet; then
            echo 'Stats unchanged; nothing to publish.'
            exit 0
          fi
          git commit -q -m "chore(stats): refresh profile stats $(date -u +%F)"
          git push -q "$remote" "HEAD:$STATS_BRANCH"
